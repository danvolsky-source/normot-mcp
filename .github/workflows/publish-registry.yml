name: Publish to MCP Registry

# Run by hand (Actions → Publish to MCP Registry → Run workflow) after a
# release: bump "version" in server.json and package.json first.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC login to the registry (namespace io.github.danvolsky-source)

env:
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the live endpoint answers
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://mcp.normot.co.il/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "tools/list -> $code"
          test "$code" = "200"
      - name: Install mcp-publisher
        run: |
          curl -sSL -o mcp-publisher.tgz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tgz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
